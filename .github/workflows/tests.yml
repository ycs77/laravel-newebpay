name: Tests

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [9.*, 10.*, 11.*, 12.*, 13.*]
        exclude:
          - php: 8.3
            laravel: 9.*
          - php: 8.4
            laravel: 9.*
          - php: 8.5
            laravel: 9.*
          - php: 8.4
            laravel: 10.*
          - php: 8.5
            laravel: 10.*
          - php: 8.1
            laravel: 11.*
          - php: 8.5
            laravel: 11.*
          - php: 8.1
            laravel: 12.*
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 13.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --ansi --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --ansi --no-security-blocking

      - name: Unit tests
        run: composer test:unit
